#Add early stopping for n_estimators for XGBoost
#Add C tuning for Log Reg and maybe remove max_iter tuning for LogReg
#Remove tuning for RandomForest n_estimators, pick a value when it plateaus and move on


xgboost:
  learning_rate:    {type: uniform, bounds: [0.01, 0.29], fine_tune: Y, alt: N/A, add: N/A, mult: [0.7, 1.0, 1.4], min: .01, max: .3, priority: high, testing_tune: Y}
  gamma: {type: uniform, bounds: [0.0, 5.0],  fine_tune: Y, alt: [0, 0.1, 0.5], add: N/A, mult: [0.5, 1.0, 2.0], min: 0.0, max: 5.0, priority: low, testing_tune: N}
  reg_alpha: {type: uniform, bounds: [0.0, 10.0], fine_tune: Y, alt: [0, 0.1, 0.5], add: N/A, mult: [0.5, 1.0, 2.0], min: 0.0, max: 10.0, priority: low, testing_tune: N}
  reg_lambda: {type: uniform, bounds: [1.0, 9.0], fine_tune: Y, alt: N/A, add: N/A, mult: [0.5, 1.0, 2.0], min: 1.0, max: 10.0, priority: low, testing_tune: N}
  min_child_weight: {type: randint, bounds: [1, 20], fine_tune: Y, alt: N/A, add: 1, mult: [0.67, 1, 1.5], min: 1, max: 20, priority: high, testing_tune: N}
  n_estimators:     {type: randint, bounds: [10, 1000], fine_tune: N, alt: N/A, add: N/A, mult: N/A, min: 10, max: 1000, priority: high, testing_tune: N}
  max_depth:        {type: randint, bounds: [3, 10], fine_tune: Y, alt: N/A, add: 1, mult: N/A, min: 3, max: 10, priority: high, testing_tune: N}
  subsample:        {type: uniform, bounds: [0.5, 0.5], fine_tune: Y, alt: N/A, add: 0.1, mult: N/A, min: .5, max: 1.0, priority: high, testing_tune: N}
  colsample_bytree: {type: uniform, bounds: [0.4, 0.6], fine_tune: Y, alt: N/A, add: 0.1, mult: N/A, min: .04, max: 1.0, priority: high, testing_tune: N}

logistic_regression:
  max_iter:          {type: randint, bounds: [100, 1000], fine_tune: N, alt: N/A, add: N/A, mult: N/A, min: 100, max: 1000, priority: high, testing_tune: N}

random_forest:
  n_estimators:      {type: randint, bounds: [50, 1000], fine_tune: N, alt: N/A, add: N/A, mult: N/A, min: 50, max: 1000, priority: high, testing_tune: Y}
  max_depth:         {type: randint, bounds: [1, 50], fine_tune: Y, alt: N/A, add: 0.20, mult: N/A, min: 1, max: 50, priority: high, testing_tune: N}
  min_samples_split: {type: randint, bounds: [2, 20], fine_tune: Y, alt: N/A, add: N/A, mult: [0.67, 1.0, 1.5], min: 2, max: 20, priority: high, testing_tune: N}
  min_samples_leaf:  {type: randint, bounds: [1, 10], fine_tune: Y, alt: N/A, add: 1, grid: N/A, min: 1, max: 10, priority: high, testing_tune: N}
  max_features:      {type: choice, values: [null, sqrt, log2, 0.2, 0.5], fine_tune: N, alt: N/A, add: N/A, grid: N/A, step: N/A, min: N/A, max: N/A, priority: N/A, testing_tune: N}
  bootstrap:         {type: choice, values: [true, false], fine_tune: N, alt: N/A, add: N/A, grid: N/A, min: N/A, max: N/A, priority: N/A, testing_tune: N}