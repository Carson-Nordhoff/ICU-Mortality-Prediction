xgboost:
  n_estimators:     {type: randint, bounds: [10, 100]}
  learning_rate:    {type: uniform, bounds: [0.01, 0.29]}
  max_depth:        {type: randint, bounds: [3, 10]}
  min_child_weight: {type: randint, bounds: [1, 7]}
  subsample:        {type: uniform, bounds: [0.5, 0.5]}
  colsample_bytree: {type: uniform, bounds: [0.4, 0.6]}
  gamma:            {type: uniform, bounds: [0, 0.5]}
  reg_alpha:        {type: uniform, bounds: [0, 2.0]}
  reg_lambda:       {type: uniform, bounds: [0.5, 5]}

logistic_regression:
  max_iter:          {type: randint, bounds: [100, 1000]}

random_forest:
  n_estimators:      {type: randint, bounds: [50, 1000]}
  max_depth:         {type: randint, bounds: [1, 50]}
  min_samples_split: {type: randint, bounds: [2, 20]}
  min_samples_leaf:  {type: randint, bounds: [1, 10]}
  max_features:      {type: choice, values: [null, sqrt, log2, 0.2, 0.5]}
  bootstrap:         {type: choice, values: [true, false]}